<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Admin Blog</title>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="flex min-h-screen">

        <aside class="w-64 bg-gray-800 text-white flex flex-col p-6 gap-4">

            <h2 class="text-xl font-bold border-b border-gray-600 pb-4">
                Admin Blog
            </h2>

            <nav class="flex flex-col gap-1">

<a href="#"
class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">Tableau de bord</a>
<a href="#"
class="px-3 py-2 rounded-lg bg-blue-600 text-white font-medium">Catégories</a>
<a href="#"class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700 hover:text-white">Articles</a></nav>
</aside>
<div class="flex-1 flex flex-col">
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
<h1 class="text-lg font-semibold text-gray-800">Gestion des catégories</h1>
<span class="text-sm text-gray-500">Admin</span>
</header>
<main class="flex-1 p-6">
<div class="max-w-5xl mx-auto">

<div class="flex items-center justify-between mb-6">

<div>                
<h2 class="text-2xl font-bold text-gray-800">Liste des catégories</h2>
<p class="text-gray-500"> Gérez les catégories de votre blog.</p></div>
<button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Nouvelle catégorie</button>
</div>
<div class="bg-white p-6 rounded-lg shadow-sm mb-6">
<h3 class="text-lg font-semibold text-gray-800 mb-4">Ajouter une catégorie</h3>
<form><div class="mb-4">
<label for="nom" class="block text-sm font-medium text-gray-700 mb-2">Nom</label>
<input type="text" id="nom" placeholder="Nom de la catégorie" class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
</div><div class="mb-4"><label
for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
<textarea id="description" placeholder="Description de la catégorie" class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
</textarea></div>
<button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Enregistrer</button>
</form></div><div class="bg-white rounded-lg shadow-sm overflow-hidden"><table class="w-full">
<thead class="bg-gray-50"><tr>
<th class="text-left text-xs text-gray-500 uppercase p-4">ID</th>
<th class="text-left text-xs text-gray-500 uppercase p-4">Nom</th>
<th class="text-left text-xs text-gray-500 uppercase p-4">Description</th>
<th class="text-left text-xs text-gray-500 uppercase p-4">Actions</th>
</tr></thead><tbody><tr class="border-b hover:bg-gray-50"><td class="p-4 text-gray-700">1</td>
<td class="p-4 font-medium text-gray-800">Développement</td>
<td class="p-4 text-gray-500">Articles sur le développement web</td>
<td class="p-4"><button class="text-blue-600 hover:text-blue-800">Modifier</button>
<button class="ml-3 text-red-600 hover:text-red-800">Supprimer</button>
</td></tr><tr class="border-b hover:bg-gray-50">
<td class="p-4 text-gray-700">2</td>
<td class="p-4 font-medium text-gray-800">Design</td>
<td class="p-4 text-gray-500">Articles sur le design
</td>
<td class="p-4">
<button class="text-blue-600 hover:text-blue-800">Modifier</button>
<button class="ml-3 text-red-600 hover:text-red-800">Supprimer</button>
</td>
</tr>
</tbody>
</table>
</div></div></main></div></div></body></html>
