
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des catégories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex flex-col md:flex-row min-h-screen">

        <!-- Sidebar -->
        <aside class="hidden md:block w-64 bg-slate-900 text-white p-6">
            <h2 class="text-2xl font-bold mb-6">Mon Blog</h2>
            <nav>
                <a href="#" class="block p-2">Catégories</a>
            </nav>
        </aside>

        <!-- Main -->
        <main class="flex-1 min-w-0 p-6">

            <h1 class="text-2xl font-bold mb-6">
                Gestion des catégories
            </h1>

            <!-- Formulaire -->
            <form id="form"
                  class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded">

                <div>
                    <label for="nom">Nom de catégorie</label>
                    <input type="text" id="nom" name="nom"
                           class="w-full border p-2 rounded" required>
                   <label for="description">Description de catégorie</label>
                           <input type="text" id="description" name="description"
                           class="w-full border p-2 rounded" required>
                </div>

                <div class="md:col-span-2">
                    <button type="submit" id="btnSubmit"
                            class="bg-blue-600 text-white px-4 py-2 rounded">
                        Ajouter
                    </button>
                </div>

            </form>

            <p id="message"></p>

            <!-- Tableau -->
            <div class="overflow-x-auto bg-white mt-6 p-4 rounded">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th class="p-2">Nom</th>
                            <th class="p-2">Description</th>
                        </tr>
                    </thead>
                    <tbody id="table-categories-body"></tbody>
                </table>
            </div>

            <div id="toast-container"></div>

        </main>
    </div>
</body>
</html>
