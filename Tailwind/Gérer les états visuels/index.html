
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des catégories</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <h2 class="text-2xl font-bold mb-6">Ajouter une catégorie</h2>

    <form id="form" class="bg-white p-6 rounded shadow max-w-md">

        <label for="name">Nom de catégorie</label>

        <input type="text" id="name" name="nom" required
            class="w-full border border-gray-300 rounded p-2 mb-4
                   focus:outline-none focus:ring-2 focus:ring-blue-500">

        <button type="submit" id="btnSubmit"
            class="bg-blue-600 text-white px-4 py-2 rounded
                   hover:bg-blue-700 transition duration-200
                   disabled:opacity-75 disabled:cursor-not-allowed
                   flex items-center gap-2">

            <svg id="spinner"
                 class="hidden w-4 h-4 animate-spin"
                 viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10"
                        stroke="currentColor" stroke-width="4"
                        class="opacity-25"/>
                <path fill="currentColor" class="opacity-75"
                      d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/>
            </svg>

            <span id="btnText">Ajouter</span>
        </button>
    </form>

    <p id="message"></p>

    <div id="toast-container"
         class="fixed bottom-4 right-4 flex flex-col gap-2">
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
