<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des catégories</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white p-6">
    <h2 class="text-xl font-bold border-b border-gray-600 pb-4">Admin Blog</h2>
    <nav class="flex flex-col gap-1">
    <a href="#" class="px-3 py-2 rounded-lg text-gray-300 hover:bg-gray-700">Tableau de bord</a>
    <a href="#" class="px-3 py-2 rounded-lg bg-blue-600 text-white">Catégories</a>
    </nav></aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b px-6 py-4 flex items-center justify-between">
    <h1 class="text-lg font-semibold text-gray-800">Gestion des catégories</h1>
    <span class="text-sm text-gray-500">Admin</span>
    </header>
    <!-- Main -->
    <main class="flex-1 p-6">
    <div class="max-w-5xl mx-auto">
    <!-- Button -->
    <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Nouvelle catégorie</button>
    <!-- Form -->
    <div class="bg-white p-6 mt-6 rounded-lg shadow-sm">
    <h2 class="text-lg font-semibold mb-4">Ajouter une catégorie</h2>
    <form>
    <label class="block text-sm font-medium text-gray-700 mb-2">Nom de la catégorie</label>
    <input type="text" placeholder="Ex: Technologie"
    class="border border-gray-300 rounded-lg w-full p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button type="submit" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Enregistrer</button>
    </form></div>
    <!-- Table -->
    <div class="bg-white mt-6 rounded-lg shadow-sm">
    <table class="w-full">
    <thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase">
        <tr>
    <th class="p-4">ID</th>
    <th class="p-4">Nom</th>
    <th class="p-4">Actions</th>
       </tr>
    </thead>
    <tbody>
    <tr class="border-b hover:bg-gray-50">
    <td class="p-4">1</td>
    <td class="p-4">Technologie</td>
    <td class="p-4">Modifier</td>
    </tr>
    <tr class="border-b hover:bg-gray-50">
    <td class="p-4">2</td>
    <td class="p-4">Sport</td>
    <td class="p-4">Modifier</td>
    </tr></tbody></table>
    </div></div></main></div></div>
</body>
</html>
